<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Stylized To-Do List</title>
</head>
<body>
    <div class="container">
        <h1><u>To-Do List</u></h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task1" />
                <label for="task1">Grocery shopping for the week</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">FreshCart Online</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task2" />
                <label for="task2">Finish reading chapter 5</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">BookNest Library</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task3" />
                <label for="task3">Book dentist appointment</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">HealthPoint Clinic</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task4" />
                <label for="task4">Pay electricity bill</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">PowerLine Utilities</a></li>
                </ul>
            </li>
        </ul>
    </div>
    <footer class="page-footer"></footer>
</body>
</html>
